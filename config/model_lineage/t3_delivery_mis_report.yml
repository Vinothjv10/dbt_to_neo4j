model:
  name: t3_delivery_mis_report
  schema: silver_layer
  materialized: table
  file_path: models/Dispatch_Dashboard/t3_delivery_mis_report.sql
  columns:
  - name: date
    expression: "select\n    A.outscan_date"
    description: The date of the outscan event (derived from outscan_date).
    source_table: t2_hub_outscan_wise_awb_level_details
    source_column: outscan_date
  - name: premise_id
    source_table: t2_hub_outscan_wise_awb_level_details
    source_column: premise_id
    expression: A.premise_id
    description: premise_id of the hub that performed the outscan.
  - name: hub
    source_table: t2_hub_outscan_wise_awb_level_details
    source_column: hub
    expression: A.hub
    description: Name of the hub that outscanned the shipment.
  - name: type
    source_table: t2_hub_outscan_wise_awb_level_details
    source_column: type
    expression: A.type
  - name: cp_id
    source_table: t2_hub_outscan_wise_awb_level_details
    source_column: cp_id
    expression: A.cp_id
  - name: channel_partner
    source_table: t2_hub_outscan_wise_awb_level_details
    source_column: channel_partner
    expression: A.channel_partner
    description: Channel partner (CP) to which the shipment was outscanned.
  - name: shipments_outscanned
    expression: count(distinct A.awb_number)
    description: Count of distinct AWBs outscanned by the hub to the channel partner
      on this date.
    source_table: t2_hub_outscan_wise_awb_level_details
    source_column: awb_number
  - name: shipments_inscanned_on_same_day
    expression: count(distinct case when A.same_cp_same_day_inscan_count > 0 or A.other_cp_same_day_inscan_count
      > 0 then A.awb_number e
    description: 'Count of distinct AWBs that were inscanned by the same CP or any
      other CP on the same day as the outscan.

      '
    source_table: t2_hub_outscan_wise_awb_level_details
    source_column: same_cp_same_day_inscan_count
  - name: shipments_not_inscanned_on_same_day
    expression: count(distinct case when coalesce(A.same_cp_same_day_inscan_count,
      0) = 0 and coalesce(A.other_cp_same_day_inscan_count,
    description: 'Count of distinct AWBs that had no inscan (by same or other CP)
      on the outscan day, and either have no inscan at all yet, or have a later-day
      inscan before the next outscan.

      '
    source_table: t2_hub_outscan_wise_awb_level_details
    source_column: same_cp_same_day_inscan_count
  - name: shipments_ofd_on_same_day
    expression: count(distinct case when A.same_cp_same_day_ofd_count > 0 or A.other_cp_same_day_ofd_count
      > 0 then A.awb_number end)
    description: 'Count of distinct AWBs that went Out For Delivery (OFD) on the same
      day as outscan, via same CP or any other CP.

      '
    source_table: t2_hub_outscan_wise_awb_level_details
    source_column: same_cp_same_day_ofd_count
  - name: shipments_rto_ofd_on_same_day
    expression: count(distinct case when A.same_cp_same_day_rto_ofd_count > 0 or A.other_cp_same_day_rto_ofd_count
      > 0 then A.awb_number
    description: 'Count of distinct AWBs that went Out For Delivery in RTO mode on
      the same day as outscan, via same CP or any other CP.

      '
    source_table: t2_hub_outscan_wise_awb_level_details
    source_column: same_cp_same_day_rto_ofd_count
  - name: shipments_delivered_on_same_day
    expression: count(distinct case when A.same_cp_same_day_delivered_count > 0 or
      A.other_cp_same_day_delivered_count > 0 then A.awb_nu
    description: 'Count of distinct AWBs successfully delivered on the same day as
      outscan, via same CP or any other CP.

      '
    source_table: t2_hub_outscan_wise_awb_level_details
    source_column: same_cp_same_day_delivered_count
  - name: shipments_rto_delivered_on_same_day
    expression: 'count(distinct case when A.same_cp_same_day_rto_delivered_count >
      0 or A.other_cp_same_day_rto_delivered_count > 0 then '
    description: 'Count of distinct AWBs delivered in RTO mode on the same day as
      outscan, via same CP or any other CP.

      '
    source_table: t2_hub_outscan_wise_awb_level_details
    source_column: same_cp_same_day_rto_delivered_count
  - name: shipments_rto_initiated_on_same_day
    expression: 'count(distinct case when A.same_cp_same_day_rto_initiated_count >
      0 or A.other_cp_same_day_rto_initiated_count > 0 then '
    description: 'Count of distinct AWBs for which RTO was initiated on the same day
      as outscan, via same CP or any other CP.

      '
    source_table: t2_hub_outscan_wise_awb_level_details
    source_column: same_cp_same_day_rto_initiated_count
  - name: shipments_undelivered_on_same_day
    expression: count(distinct case when A.same_cp_same_day_undelivered_count > 0
      or A.other_cp_same_day_undelivered_count > 0 then A.aw
    description: 'Count of distinct AWBs that had an undelivered attempt on the same
      day as outscan, via same CP or any other CP.

      '
    source_table: t2_hub_outscan_wise_awb_level_details
    source_column: same_cp_same_day_undelivered_count
  - name: shipments_rto_undelivered_on_same_day
    expression: count(distinct case when A.same_cp_same_day_rto_undelivered_count
      > 0 or A.other_cp_same_day_rto_undelivered_count > 0 t
    description: 'Count of distinct AWBs that had an undelivered attempt in RTO mode
      on the same day as outscan, via same CP or any other CP.

      '
    source_table: t2_hub_outscan_wise_awb_level_details
    source_column: same_cp_same_day_rto_undelivered_count
  - name: ndd
    expression: count(distinct case when A.same_cp_next_day_delivered_count > 0 or
      A.same_cp_next_day_rto_delivered_count > 0 or A.other
    source_table: t2_hub_outscan_wise_awb_level_details
    source_column: same_cp_next_day_delivered_count
  - name: ndd_plus_1
    expression: count(distinct case when A.same_cp_d_plus_2_delivered_count > 0 or
      A.same_cp_d_plus_2_rto_delivered_count > 0 or A.other
    source_table: t2_hub_outscan_wise_awb_level_details
    source_column: same_cp_d_plus_2_delivered_count
  - name: ndd_plus_2
    expression: count(distinct case when A.same_cp_d_plus_3_delivered_count > 0 or
      A.same_cp_d_plus_3_rto_delivered_count > 0 or A.other
    source_table: t2_hub_outscan_wise_awb_level_details
    source_column: same_cp_d_plus_3_delivered_count
  - name: ndd_plus_3
    expression: count(distinct case when A.same_cp_d_plus_4_delivered_count > 0 or
      A.same_cp_d_plus_4_rto_delivered_count > 0 or A.other
    source_table: t2_hub_outscan_wise_awb_level_details
    source_column: same_cp_d_plus_4_delivered_count
  - name: ndd_plus_4
    expression: count(distinct case when A.same_cp_d_plus_5_delivered_count > 0 or
      A.same_cp_d_plus_5_rto_delivered_count > 0 or A.other
    source_table: t2_hub_outscan_wise_awb_level_details
    source_column: same_cp_d_plus_5_delivered_count
  - name: ndd_greater_4
    expression: count(distinct case when A.same_cp_d_greater_5_delivered_count > 0
      or A.same_cp_d_greater_5_rto_delivered_count > 0 or A
    source_table: t2_hub_outscan_wise_awb_level_details
    source_column: same_cp_d_greater_5_delivered_count
  upstreams:
  - name: t2_hub_outscan_wise_awb_level_details
    schema: silver_layer
    column_lineage:
    - column: date
      from_column: outscan_date
    - column: premise_id
      from_column: premise_id
    - column: hub
      from_column: hub
    - column: type
      from_column: type
    - column: cp_id
      from_column: cp_id
    - column: channel_partner
      from_column: channel_partner
    - column: shipments_outscanned
      from_column: awb_number
    - column: shipments_inscanned_on_same_day
      from_column: same_cp_same_day_inscan_count
    - column: shipments_not_inscanned_on_same_day
      from_column: same_cp_same_day_inscan_count
    - column: shipments_ofd_on_same_day
      from_column: same_cp_same_day_ofd_count
    - column: shipments_rto_ofd_on_same_day
      from_column: same_cp_same_day_rto_ofd_count
    - column: shipments_delivered_on_same_day
      from_column: same_cp_same_day_delivered_count
    - column: shipments_rto_delivered_on_same_day
      from_column: same_cp_same_day_rto_delivered_count
    - column: shipments_rto_initiated_on_same_day
      from_column: same_cp_same_day_rto_initiated_count
    - column: shipments_undelivered_on_same_day
      from_column: same_cp_same_day_undelivered_count
    - column: shipments_rto_undelivered_on_same_day
      from_column: same_cp_same_day_rto_undelivered_count
    - column: ndd
      from_column: same_cp_next_day_delivered_count
    - column: ndd_plus_1
      from_column: same_cp_d_plus_2_delivered_count
    - column: ndd_plus_2
      from_column: same_cp_d_plus_3_delivered_count
    - column: ndd_plus_3
      from_column: same_cp_d_plus_4_delivered_count
    - column: ndd_plus_4
      from_column: same_cp_d_plus_5_delivered_count
    - column: ndd_greater_4
      from_column: same_cp_d_greater_5_delivered_count
